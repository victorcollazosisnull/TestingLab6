name: Unity CI

on: [push, pull_request]

jobs:
  test-build:
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: . # Cambia si tu proyecto está en subcarpeta
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 💾 Cache Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Lib-${{ runner.os }}-${{ hashFiles('**/Packages/manifest.json') }}
          restore-keys: Lib-${{ runner.os }}-

      - name: 🧪 Run Tests (Edit + Play)
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: auto        # Detecta versión real del proyecto
          testMode: all
          artifactsPath: TestResults
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: 🏗️ Build WebGL
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: auto        # Detecta versión real del proyecto
          targetPlatform: WebGL
          buildsPath: builds
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: 📦 Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebGL+Tests
          path: |
            builds/WebGL
            TestResults
